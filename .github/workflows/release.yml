name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (for example, 1.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag and build release
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: npm

      - name: Create release tag
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Version must be valid semver without a v prefix (for example, 1.2.0)."
            exit 1
          fi

          tag="v$VERSION"
          git fetch --tags

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag already exists at a different commit."
              exit 1
            fi
            echo "Tag $tag already points to this commit; continuing for a safe rerun."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build release
        run: npm run build

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-arcade-${{ steps.release.outputs.tag }}
          path: dist/
          if-no-files-found: error
