<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9ece0">
  <meta name="description" content="Pilih game klasik dan mulai bermain di Pocket Arcade.">
  <title>Pocket Arcade | Pilih Game</title>
  <link rel="stylesheet" href="./portal.css">
  <script type="module" src="./portal.js"></script>
</head>
<body>
  <main class="arcade-shell">
    <header class="topline">
      <a class="brand" href="/" aria-label="Pocket Arcade home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>POCKET ARCADE</span>
      </a>
      <span class="edition">CLASSIC SERIES <span>01—03</span></span>
    </header>

    <section class="welcome" aria-labelledby="welcome-title">
      <p class="eyebrow">MASUKKAN KOIN VIRTUAL</p>
      <h1 id="welcome-title">PILIH PERMAINAN.<br><span>KEJAR SKOR TERBAIK.</span></h1>
      <p class="intro">Masukkan nama pemainmu, lalu pilih game untuk mulai bermain.</p>

      <form class="player-form" id="player-form">
        <label for="player-name">NAMA PEMAIN</label>
        <div class="player-entry">
          <input
            id="player-name"
            name="name"
            type="text"
            maxlength="30"
            autocomplete="nickname"
            placeholder="Contoh: PLAYER 01"
            required
          >
          <button type="submit">SIMPAN NAMA</button>
        </div>
        <p id="player-status" class="player-status" role="status" aria-live="polite">
          Nama akan digunakan untuk mengisi skor di semua game.
        </p>
      </form>
    </section>

    <section class="game-section" aria-labelledby="games-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">PILIH GAME</p>
          <h2 id="games-title">ARCADE LIBRARY</h2>
        </div>
        <span class="game-count">03 GAMES</span>
      </div>

      <div class="game-grid">
        <button class="game-card" type="button" data-game="snake" disabled>
          <span class="game-number">01 / SCORE ATTACK</span>
          <span class="game-art snake-art" aria-hidden="true"><i></i></span>
          <span class="game-name">SNAKE</span>
          <span class="game-description">Makan, tumbuh, dan jangan menabrak dirimu sendiri.</span>
          <span class="game-action">MAIN SEKARANG <span aria-hidden="true">↗</span></span>
        </button>
        <button class="game-card" type="button" data-game="tetris" disabled>
          <span class="game-number">02 / BLOCK DROP</span>
          <span class="game-art tetris-art" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i>
          </span>
          <span class="game-name">TETRIS</span>
          <span class="game-description">Susun balok, bersihkan garis, pecahkan rekor.</span>
          <span class="game-action">MAIN SEKARANG <span aria-hidden="true">↗</span></span>
        </button>
        <button class="game-card" type="button" data-game="breakout" disabled>
          <span class="game-number">03 / BRICK BREAKER</span>
          <span class="game-art breakout-art" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </span>
          <span class="game-name">BREAKOUT</span>
          <span class="game-description">Pantulkan bola dan hancurkan semua bata.</span>
          <span class="game-action">MAIN SEKARANG <span aria-hidden="true">↗</span></span>
        </button>
      </div>
    </section>

    <footer class="bottomline">
      <span>POCKET ARCADE</span>
      <span>INSERT NAME / START GAME</span>
    </footer>
  </main>
</body>
</html>
